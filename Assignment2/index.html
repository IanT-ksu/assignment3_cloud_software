<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Garden</title>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="imgs/icon.png"> <!--Icon created by Magnific-->
</head>

<body class="login-body">
    <div>
        <h1>Login to Cloud Garden</h1>
    </div>
    <img src="imgs/icon.png" alt="Logo"> <!--Icon created by Magnific-->
    <form class="login-form" id="loginForm" method="post" action="login.php">
        <div class="credentials">
            <label for="username">Username:</label>
            <input type="text" name="username" required>
        </div>
        <div class="credentials">
            <label for="password">Password:</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-btns">
            <button type="submit">Login</button>
        </div>
    </form>

</body>

</html>
